
name: APAC Time Zone Converter CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run quality checks
      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Validate HTML
        run: npm run validate:html

      # Step 5: Prepare Docker build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 7: Build and publish Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ssquadri/apac-timezone-converter:latest
            ssquadri/apac-timezone-converter:${{ github.sha }}

      # Step 8: Trigger Render deployment
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "$RENDER_DEPLOY_HOOK"
